apiVersion: v1
kind: Service
metadata:
  name: dmqtt-headless
  namespace: dmqtt
  labels:
    app.kubernetes.io/name: dmqtt
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dmqtt
  ports:
  - name: gossip-tcp
    port: 7000
    targetPort: 7000
    protocol: TCP
  - name: gossip-udp
    port: 7000
    targetPort: 7000
    protocol: UDP
  - name: transport
    port: 8000
    targetPort: 8000
  - name: mqtt
    port: 1883
    targetPort: 1883
