apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dmqtt-node
  namespace: dmqtt
  labels:
    app.kubernetes.io/name: dmqtt
spec:
  serviceName: dmqtt-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: dmqtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmqtt
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: cluster-init
        image: dmqtt:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          NODE_ID=$(hostname)
          HOST=$(hostname -i)
          REPLICAS=3
          SEEDS=""
          for i in $(seq 0 $((REPLICAS - 1))); do
            PEER="dmqtt-node-${i}.dmqtt-headless.dmqtt.svc.cluster.local:7000"
            if [ "dmqtt-node-${i}" != "${NODE_ID}" ]; then
              SEEDS="${SEEDS:+${SEEDS},}${PEER}"
            fi
          done
          cat > /env/cluster.env << EOF
          DMQTT_CLUSTER_NODE_ID=${NODE_ID}
          DMQTT_CLUSTER_HOST=${HOST}
          DMQTT_CLUSTER_SEEDS=${SEEDS}
          EOF
        volumeMounts:
        - name: env-shared
          mountPath: /env
      containers:
      - name: dmqtt
        image: dmqtt:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -a
          . /env/cluster.env
          set +a
          exec dmqtt
        envFrom:
        - configMapRef:
            name: dmqtt-config
        ports:
        - name: mqtt
          containerPort: 1883
        - name: http
          containerPort: 9090
        - name: gossip
          containerPort: 7000
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data/dmqtt
        - name: env-shared
          mountPath: /env
      volumes:
      - name: env-shared
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi
