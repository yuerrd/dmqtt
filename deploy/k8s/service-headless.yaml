apiVersion: v1
kind: Service
metadata:
  name: dmqtt-headless
  namespace: dmqtt
  labels:
    app.kubernetes.io/name: dmqtt
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dmqtt
  ports:
  - name: gossip
    port: 7000
    targetPort: 7000
  - name: mqtt
    port: 1883
    targetPort: 1883
